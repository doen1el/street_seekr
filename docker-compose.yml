services:
  web:
    container_name: street_seekr
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ORIGIN: http://localhost:5173 # change this to your domain in production
      PANORAMAX_API_URL: https://panoramax.ign.fr/api
      PUBLIC_PANORAMAX_VIEWER_URL: https://panoramax.ign.fr
      STREETSEEKR_DB: /data/streetseekr.db
      # Behind a reverse proxy on another domain, list it so the WebSocket
      # accepts cross-origin upgrades, e.g.:
      # STREETSEEKR_ALLOWED_ORIGINS: https://streetseekr.example.com
    volumes:
      - db_data:/data
    ports:
      - '5173:3000' # change 5173 to the port you want to use

volumes:
  db_data:
